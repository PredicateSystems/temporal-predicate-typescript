name: Release to npm

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            package.json
            README.md
            LICENSE

  publish-npm:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: npm
      url: https://www.npmjs.com/package/@predicatesystems/temporal
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    runs-on: ubuntu-latest
    needs: publish-npm
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist-artifact

      - name: Create tarball
        run: |
          cd dist-artifact
          npm pack
          mv *.tgz ../

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tgz"
          generate_release_notes: true
          body: |
            ## @predicatesystems/temporal ${{ github.ref_name }}

            Install from npm:
            ```bash
            npm install @predicatesystems/temporal@${{ github.ref_name }}
            ```

            See [README](https://github.com/PredicateSystems/predicate-temporal-ts#readme) for usage.
